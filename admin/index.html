<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>WoodCraft Admin</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

<header class="admin-header">

    <h1>WOODCRAFT ADMIN</h1>

    <button onclick="logout()">
        Logout
    </button>

</header>


<main class="dashboard">

    <section class="stats">

        <div>
            <span>Total Orders</span>
            <strong id="totalOrders">0</strong>
        </div>

        <div>
            <span>Paid Orders</span>
            <strong id="paidOrders">0</strong>
        </div>

        <div>
            <span>Pending Payment</span>
            <strong id="pendingOrders">0</strong>
        </div>

        <div>
            <span>Total Sales</span>
            <strong id="totalSales">₹0</strong>
        </div>

    </section>


    <section class="panel">

        <div class="panel-header">

            <h2>Orders</h2>

            <button onclick="loadOrders()">
                Refresh
            </button>

        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>

                </thead>

                <tbody id="ordersTable">

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="admin.js"></script>

</body>
</html>
